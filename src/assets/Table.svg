  <path d="M256 218 A172 172 0 0 1 428 390 L372 390 A116 116 0 0 0 256 274 Z" fill="#D97A5C" />
  <!-- Reflet -->
  <path d="M132 356 A124 124 0 0 1 236 266" fill="none" stroke="#F7B79A" stroke-width="22" stroke-linecap="round" />
  <!-- Poignée : boule ronde soudée au sommet -->
  <circle cx="256" cy="196" r="34" fill="#B86A4C" />
  <circle cx="246" cy="186" r="12" fill="#D97A5C" />
  <!-- Plateau (collé sous la cloche) -->
  <rect x="40" y="390" width="432" height="52" rx="26" fill="#B86A4C" />
  <rect x="40" y="390" width="432" height="26" rx="13" fill="#D97A5C" />
</svg>
