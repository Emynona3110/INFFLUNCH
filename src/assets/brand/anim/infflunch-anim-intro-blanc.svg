<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 70 90" width="700" height="900">
  <title>infflunch</title>
  <style>.m-fork,.m-knife,.m-dot{transform-box:fill-box}.m-fork,.m-knife{transform-origin:50% 100%}.m-dot{transform-origin:50% 50%}.m-l{animation:m-rise .55s cubic-bezier(.18,.9,.3,1.15) both}.m-dot{animation:m-pop 1s 0.20s both}.m-fork{animation:m-clink-fork .5s 1.15s ease-in-out both}.m-knife{animation:m-clink-knife .5s 1.15s ease-in-out both}@keyframes m-rise{from{transform:translateY(66px)}to{transform:translateY(0)}}@keyframes m-pop{0%{transform:translateY(0) rotate(0);animation-timing-function:cubic-bezier(.15,.6,.35,1)}40%{transform:translateY(-16px) rotate(180deg);animation-timing-function:cubic-bezier(.6,0,.8,.4)}70%{transform:translateY(0) rotate(360deg);animation-timing-function:ease-out}79%{transform:translateY(-2.5px) rotate(360deg);animation-timing-function:ease-in}87%{transform:translateY(0) rotate(360deg);animation-timing-function:ease-out}93%{transform:translateY(-.6px) rotate(360deg);animation-timing-function:ease-in}100%{transform:translateY(0) rotate(360deg)}}@keyframes m-clink-fork{0%,100%{transform:rotate(0)}45%{transform:rotate(2.9deg)}}@keyframes m-clink-knife{0%,100%{transform:rotate(0)}45%{transform:rotate(-2.9deg)}}@media (prefers-reduced-motion:reduce){.m-l,.m-fork,.m-knife,.m-dot{animation:none!important}}</style>
