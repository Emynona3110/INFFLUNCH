<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 70 84" width="700" height="840">
  <title>Chargement infflunch</title>
  <style>
    .fork, .knife, .dot { transform-box: fill-box; }
    .fork, .knife { transform-origin: 50% 100%; }
    .fork { animation: clink-l 1.6s ease-in-out infinite; }
    .knife { animation: clink-r 1.6s ease-in-out infinite; }
    .dot { transform-origin: 50% 50%; animation: hop 1.6s infinite; }
    @keyframes hop {
      0%, 20% { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
      45%     { transform: translateY(-12px) rotate(180deg); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
      68%     { transform: translateY(0) rotate(360deg); animation-timing-function: ease-out; }
      76%     { transform: translateY(-2px) rotate(360deg); animation-timing-function: ease-in; }
      84%, 100% { transform: translateY(0) rotate(360deg); }
    }
    @keyframes clink-l { 0%, 66%, 90%, 100% { transform: rotate(0); } 76% { transform: rotate(3deg); } }
    @keyframes clink-r { 0%, 66%, 90%, 100% { transform: rotate(0); } 76% { transform: rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path class="fork" fill="#FFFFFF" d="M19.393 42.443 L22.533 41.187 V54 A1.6 1.6 0 0 0 25.733 54 V39.907 L30.267 38.093 V54 A1.6 1.6 0 0 0 33.467 54 V36.813 L36.607 35.557 Q38 35 38 36.5 V73 A7 7 0 0 1 31 80 H25 A7 7 0 0 1 18 73 V44.5 Q18 43 19.393 42.443 Z"/>
  <path class="knife" fill="#FFFFFF" d="M51 80 A7 7 0 0 1 44 73 V21.5 Q44 20.1 45.4 20.4 C55 22.5 64 31 64 43 V73 A7 7 0 0 1 57 80 Z"/>
  <path class="dot" fill="#EA580C" d="M19.393 27.443 L36.607 20.557 Q38 20 38 21.5 V28.5 Q38 30 36.607 30.557 L19.393 37.443 Q18 38 18 36.5 V29.5 Q18 28 19.393 27.443 Z"/>
</svg>
