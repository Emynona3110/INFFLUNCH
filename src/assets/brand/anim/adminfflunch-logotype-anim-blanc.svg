  <title>adminfflunch</title>
  <style>
    .alt-l { animation: alt-rise .55s cubic-bezier(.18,.9,.3,1.15) both; }
    .alt-fork, .alt-knife { transform-box: fill-box; transform-origin: 50% 100%; }
    .alt-fork { animation: alt-clink-l .5s 1.65s ease-in-out both; }
    .alt-knife { animation: alt-clink-r .5s 1.65s ease-in-out both; }
    .alt-dot { transform-box: fill-box; transform-origin: 50% 50%; animation: alt-drop .8s 1.05s both; }
    @keyframes alt-rise { from { transform: translateY(64px); } to { transform: translateY(0); } }
    @keyframes alt-clink-l { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(4deg); } }
    @keyframes alt-clink-r { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-4deg); } }
    @keyframes alt-drop {
      0% { transform: translateY(-40px) rotate(-200deg); opacity: 0; animation-timing-function: cubic-bezier(.5,0,.9,.5); }
      15% { opacity: 1; }
      60% { transform: translateY(0) rotate(0); animation-timing-function: ease-out; }
      75% { transform: translateY(-4px); animation-timing-function: ease-in; }
      88% { transform: translateY(0); animation-timing-function: ease-out; }
      94% { transform: translateY(-.8px); animation-timing-function: ease-in; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .alt-l, .alt-fork, .alt-knife, .alt-dot { animation: none !important; } }
  </style>
