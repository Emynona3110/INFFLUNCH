<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 15 480 450">
<style>.hlm-bat{animation-iteration-count:1;animation-fill-mode:both;transform-box:view-box;transform-origin:0 0}
@keyframes hlm-bat-a{0%,20%{transform:translate(240px,250px) scale(5) rotate(0deg);animation-timing-function:ease-in}32%{transform:translate(310px,170px) scale(3) rotate(-10deg);animation-timing-function:linear}46%{transform:translate(340px,95px) scale(1.7) rotate(8deg);animation-timing-function:linear}60%{transform:translate(225px,70px) scale(1.05) rotate(-8deg);animation-timing-function:ease-in}72%{transform:translate(175px,158px) scale(.66) rotate(0deg);animation-timing-function:ease-out}77%,100%{transform:translate(175px,152px) scale(.66) rotate(0deg)}}
.hlm-wing{animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:0% 74%}
@keyframes hlm-wing-a{0%,20%{transform:rotate(0deg) scaleX(1)}8%{transform:rotate(-6deg) scaleX(1)}14%{transform:rotate(4deg) scaleX(1)}24%{transform:rotate(-28deg) scaleX(1)}29%{transform:rotate(22deg) scaleX(1)}34%{transform:rotate(-28deg) scaleX(1)}39%{transform:rotate(22deg) scaleX(1)}44%{transform:rotate(-28deg) scaleX(1)}49%{transform:rotate(22deg) scaleX(1)}54%{transform:rotate(-28deg) scaleX(1)}59%{transform:rotate(22deg) scaleX(1)}64%{transform:rotate(-10deg) scaleX(.9)}69%,80%{transform:rotate(35deg) scaleX(.3)}88%{transform:rotate(-8deg) scaleX(1.1)}94%{transform:rotate(2deg) scaleX(.97)}100%{transform:rotate(0deg) scaleX(1)}}
.hlm-mono{animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:50% 50%}
@keyframes hlm-mono-a{0%,20%{opacity:0;transform:scale(.9)}36%{opacity:1;transform:scale(1.02)}44%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.hlm-bat{animation:none;transform:translate(175px,152px) scale(.66)}.hlm-wing,.hlm-mono{animation:none}}</style>
<g class="hlm-mono" style="animation-name: hlm-mono-a; animation-duration: 2.40s">
