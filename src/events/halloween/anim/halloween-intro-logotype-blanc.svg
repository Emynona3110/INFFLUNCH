<style>.hll-bat{animation-iteration-count:1;animation-fill-mode:both;transform-box:view-box;transform-origin:0 0}
@keyframes hll-bat-a{0%,20%{transform:translate(480px,190px) scale(4.5) rotate(0deg);animation-timing-function:ease-in}32%{transform:translate(600px,120px) scale(2.6) rotate(-10deg);animation-timing-function:linear}46%{transform:translate(420px,60px) scale(1.4) rotate(8deg);animation-timing-function:linear}60%{transform:translate(200px,70px) scale(.7) rotate(-8deg);animation-timing-function:ease-in}72%{transform:translate(88px,140px) scale(.3) rotate(0deg);animation-timing-function:ease-out}77%,100%{transform:translate(88px,136px) scale(.3) rotate(0deg)}}
.hll-wing{animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:0% 74%}
@keyframes hll-wing-a{0%,20%{transform:rotate(0deg) scaleX(1)}8%{transform:rotate(-6deg) scaleX(1)}14%{transform:rotate(4deg) scaleX(1)}24%{transform:rotate(-28deg) scaleX(1)}29%{transform:rotate(22deg) scaleX(1)}34%{transform:rotate(-28deg) scaleX(1)}39%{transform:rotate(22deg) scaleX(1)}44%{transform:rotate(-28deg) scaleX(1)}49%{transform:rotate(22deg) scaleX(1)}54%{transform:rotate(-28deg) scaleX(1)}59%{transform:rotate(22deg) scaleX(1)}64%{transform:rotate(-10deg) scaleX(.9)}69%,80%{transform:rotate(35deg) scaleX(.3)}88%{transform:rotate(-8deg) scaleX(1.1)}94%{transform:rotate(2deg) scaleX(.97)}100%{transform:rotate(0deg) scaleX(1)}}
.hll-hopb{animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
.hll-mono{animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:50% 50%}
@keyframes hll-mono-a{0%,20%{opacity:0;transform:scale(.94)}36%{opacity:1;transform:scale(1.01)}44%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.hll-bat{animation:none;transform:translate(88px,136px) scale(.3)}.hll-wing,.hll-mono,.hll-hopb{animation:none}}</style>
