    />
    <title>INFFLUNCH</title>
    <!-- Anti-FOUC : applique le thème stocké avant le rendu -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Monogramme de chargement : servi avec la page elle-même (visible
         pendant le téléchargement du code, après 750 ms), puis réutilisé
         par l'app pour toutes ses attentes plein écran (screenLoaderControl.ts) :
         un seul élément, une animation qui ne repart jamais du début. -->
    <style>
      html { background: #f4f7fc; }
      html.dark { background: #0a1024; }
      #boot-loader { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.25s linear; }
      #boot-loader.booting { animation: boot-in 0.25s linear 0.75s forwards; }
      #boot-loader img { height: 5rem; width: auto; }
      #boot-loader .w, html.dark #boot-loader .b { display: none; }
      html.dark #boot-loader .w { display: block; }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
