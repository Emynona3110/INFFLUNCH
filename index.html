<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/brand/infflunch-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA : nécessaire pour les notifications push (sur iOS, elles
         n'existent que pour une app ajoutée à l'écran d'accueil). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="INFFLUNCH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#113894" />
    <!-- Hors des résultats de recherche (site interne). N.B. : ne restreint PAS
         l'accès — la vraie protection reste l'authentification + RLS. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Police du site : Plus Jakarta Sans (titres et texte courant), 3 graisses : 500 texte et interface, 600 petites mises en avant, 700 titres et noms -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>INFFLUNCH</title>
    <!-- Anti-FOUC : applique le thème stocké avant le rendu -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Monogramme de chargement : servi avec la page elle-même (visible
         pendant le téléchargement du code, après 1 s), puis réutilisé
         par l'app pour toutes ses attentes plein écran (screenLoaderControl.ts) :
         un seul élément. SVG inline (et non <img>) : l'app lit et relance
         son animation, pour ne jamais l'effacer en plein saut. -->
    <style>
      html { background: #f4f7fc; }
      html.dark { background: #0a1024; }
      #boot-loader { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.25s linear; }
      #boot-loader.booting { animation: boot-in 0.25s linear 1s forwards; }
      #boot-loader { color: #113894; }
      html.dark #boot-loader { color: #ffffff; }
      #boot-loader svg { height: 5.375rem; width: auto; }
      /* La boucle démarre avec l'apparition (1 s) : le premier cycle visible
         est complet. screenLoaderControl.ts la relance à chaque apparition. */
      #boot-loader .bl-fork, #boot-loader .bl-knife, #boot-loader .bl-dot { animation-delay: 1s; }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="boot-loader" class="booting" role="status" aria-label="Chargement">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 70 90" aria-hidden="true"><style>.bl-fork,.bl-knife,.bl-dot{transform-box:fill-box}.bl-fork,.bl-knife{transform-origin:50% 100%}.bl-dot{transform-origin:50% 50%}.bl-fork{animation:bl-loop-fork 1.1s infinite}.bl-knife{animation:bl-loop-knife 1.1s infinite}.bl-dot{animation:bl-loop-dot 1.1s infinite}@keyframes bl-loop-fork{0%{transform:translateY(0) rotate(0);animation-timing-function:cubic-bezier(.2,.8,.4,1)}10%{transform:translateY(-5px) rotate(0);animation-timing-function:cubic-bezier(.6,0,.9,.5)}22.7%{transform:translateY(0) rotate(0)}62.1%{transform:translateY(0) rotate(0);animation-timing-function:ease-out}69.1%{transform:translateY(0) rotate(2.9deg);animation-timing-function:ease-in-out}79.1%,100%{transform:translateY(0) rotate(0)}}@keyframes bl-loop-knife{0%,62.1%{transform:rotate(0);animation-timing-function:ease-out}69.1%{transform:rotate(-2.9deg);animation-timing-function:ease-in-out}79.1%,100%{transform:rotate(0)}}@keyframes bl-loop-dot{0%,7.3%{transform:translateY(0) rotate(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}28.3%{transform:translateY(-12px) rotate(180deg);animation-timing-function:cubic-bezier(.6,0,.8,.4)}48.3%{transform:translateY(0) rotate(360deg);animation-timing-function:ease-out}54.3%{transform:translateY(-1.5px) rotate(360deg);animation-timing-function:ease-in}60.3%,100%{transform:translateY(0) rotate(360deg)}}@media (prefers-reduced-motion:reduce){.bl-l,.bl-fork,.bl-knife,.bl-dot{animation:none!important}}</style><g class="bl-fork"><path fill="currentColor" d="M19.393 42.443 L22.533 41.187 V54 A1.6 1.6 0 0 0 25.733 54 V39.907 L30.267 38.093 V54 A1.6 1.6 0 0 0 33.467 54 V36.813 L36.607 35.557 Q38 35 38 36.5 V73 A7 7 0 0 1 31 80 H25 A7 7 0 0 1 18 73 V44.5 Q18 43 19.393 42.443 Z"></path><path class="bl-dot" fill="#EA580C" d="M19.393 27.443 L36.607 20.557 Q38 20 38 21.5 V28.5 Q38 30 36.607 30.557 L19.393 37.443 Q18 38 18 36.5 V29.5 Q18 28 19.393 27.443 Z"></path></g><g class="bl-knife"><path fill="currentColor" d="M51 80 A7 7 0 0 1 44 73 V21.5 Q44 20.1 45.4 20.4 C55 22.5 64 31 64 43 V73 A7 7 0 0 1 57 80 Z"></path></g></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
